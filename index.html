<!doctype html>
<html lang="en" data-theme="dark">
<head>

  <title>Learning Hub</title>
  <meta name="description" content="Everett's interactive learning hub — cert prep in bursts, quizzes, and chapter exams.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

<body>
  <a class="skip" href="#main">Skip to content</a>

  <header class="topbar">
    <a class="brand" href="#/" aria-label="Learning Hub home">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="22" height="22"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6E7CFF"/><stop offset="1" stop-color="#38D9F5"/></linearGradient></defs><path d="M32 10l5.6 13.3L52 26l-13 8.4L42.6 50 32 41.2 21.4 50 25 34.4 12 26l14.4-2.7z" fill="url(#bg)"/></svg>
      </span>
      <span class="brand-name">Learning<span class="brand-accent">Hub</span></span>
    </a>
    <nav class="topnav" aria-label="Primary">
      <a href="#/" data-nav="home">Home</a>
    </nav>
    <div class="top-actions">
      <span class="streak-pill" id="streakPill" title="Days studied in a row" hidden>🔥 <b id="streakCount">0</b></span>
      <button class="icon-btn" id="themeToggle" aria-label="Toggle light/dark theme" title="Toggle theme">
        <svg class="ic-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main id="main" class="view" tabindex="-1"></main>

  <footer class="footer">
    <span>Built with Claude · study in bursts, quiz everything</span>
  </footer>

  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="data/registry.js"></script>
  <script src="app.js"></script>
</body>
</html>
